# Single profile file for now. Per-env files (-dev/-prod) come in Phase 6.
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:bankingdb}
    username: ${POSTGRES_USER:banking}
    password: ${POSTGRES_PASSWORD:banking123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    # open-in-view: false keeps every database query inside the service
    # layer. With true (the default), rendering a web page could silently
    # trigger extra queries, hiding slow N+1 patterns until production.
    open-in-view: false
    hibernate:
      # ddl-auto: validate means Flyway migrations own the tables and JPA
      # only checks the entities match — it never creates or alters columns.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Schemas are created by migration V1, not by JPA.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.bank: DEBUG